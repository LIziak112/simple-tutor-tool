<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>数学练习 · 学生端</title>
  <link rel="icon" href="data:,">
  <script>
    /* CDN 失败降级标记：任何 CDN 资源加载失败都会在此登记（window.__cdnMissing），
       页面逻辑同时具备运行时特性检测，双重保险，CDN 挂掉时页面功能不崩溃。 */
    window.__cdnFail = function (key) {
      try {
        window.__cdnMissing = window.__cdnMissing || {};
        window.__cdnMissing[key] = true;
      } catch (e) { /* 忽略 */ }
    };
  </script>
  <!-- KaTeX 样式：加载失败时公式退化为纯文本，不影响功能 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" onerror="__cdnFail('katex-css')">
  <link rel="stylesheet" href="css/student.css">
</head>
<body>
  <!-- 顶栏：标题 / 姓名 / 计时 / 连接状态（离线模式 或 已连接） -->
  <header class="topbar" id="topbar">
    <div class="topbar-title">数学练习 · 学生端</div>
    <div class="topbar-right">
      <span class="chip chip-name" id="nameChip" hidden></span>
      <span class="chip chip-time" id="timeChip" hidden>已用时 00:00</span>
      <span class="chip chip-warn" id="netBadge">连接中…</span>
    </div>
  </header>

  <!-- 首屏：输入姓名（localStorage 记住 + 历史姓名下拉） -->
  <section class="view" id="nameView">
    <div class="card name-card">
      <h1>欢迎来做题</h1>
      <p class="muted">请输入你的姓名进入。老师端会按姓名查看你的作答与手写笔迹。</p>
      <input type="text" id="nameInput" list="nameHistoryList" placeholder="请输入姓名" autocomplete="off" maxlength="20">
      <datalist id="nameHistoryList"></datalist>
      <button type="button" class="btn primary block" id="nameEnterBtn">进入</button>
    </div>
  </section>

  <!-- 主界面：讲义 / 练习 两个 Tab -->
  <main id="appView" hidden>
    <nav class="tabs">
      <button type="button" class="tab-btn active" id="tabLecture">讲义</button>
      <button type="button" class="tab-btn" id="tabPractice">练习</button>
    </nav>

    <!-- 讲义列表 -->
    <section class="view" id="lectureListView">
      <div id="lectureList" class="list"></div>
    </section>

    <!-- 讲义阅读页 -->
    <section class="view" id="lectureView" hidden>
      <div class="lecture-head">
        <button type="button" class="btn" id="lectureBackBtn">← 返回讲义列表</button>
      </div>
      <article class="card" id="lectureContent"></article>
    </section>

    <!-- 练习（单元）列表 -->
    <section class="view" id="unitListView" hidden>
      <div id="unitList" class="list"></div>
    </section>

    <!-- 答题页 -->
    <section class="view" id="quizView" hidden>
      <div id="quizHead"></div>
      <div id="questionList"></div>
    </section>
  </main>

  <!-- 底部固定：交卷按钮 -->
  <footer id="quizFooter" hidden>
    <button type="button" class="btn primary submit-btn" id="submitBtn">交卷</button>
  </footer>

  <!-- 轻提示 -->
  <div id="toast" hidden></div>

  <noscript>
    <div class="noscript">本页面需要启用 JavaScript 才能使用，请在浏览器设置中开启后刷新。</div>
  </noscript>

  <!-- CDN 库：均带 onerror 降级标记；均 defer，按声明顺序执行，本地脚本最后加载 -->
  <script src="https://cdn.jsdelivr.net/npm/perfect-freehand@1.2.2/dist/index.umd.min.js" defer onerror="__cdnFail('perfect-freehand')"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer onerror="__cdnFail('marked')"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer onerror="__cdnFail('katex')"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" defer onerror="__cdnFail('katex-auto-render')"></script>
  <script src="js/handwrite.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
