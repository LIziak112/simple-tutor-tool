# CI：install → lint → typecheck → test → build（开发任务清单 T0.6）
name: CI

# 触发：push 到所有分支 + 所有 pull_request
on:
  push:
  pull_request:

# 同一分支/PR 有新推送时，取消仍在跑的旧运行，节省 CI 时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / test / build
    # ubuntu-latest 自 2026-10-19 起渐进迁移到 Ubuntu 26.04（至 11-19），窗口期内同一工作流
    # 会随机落在 24/26 两代系统上；显式钉 24.04 保证构建环境确定。切 26.04 时另行专门验证。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # 不传 version，pnpm/action-setup 自动读取根 package.json 的 packageManager 字段（pnpm@12.6.0）。
      # v6 运行在 Node 24（v4 标签仍指向 node20 构建，已被 GitHub 弃用告警），v6.1.0 起明确支持 pnpm v12
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      # Node 版本与仓库约定一致（根 engines: >=24、.nvmrc: 24）；启用 pnpm store 缓存加速安装
      - name: 安装 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，保证可复现
      # pnpm 12 会自动遵守 pnpm-workspace.yaml 的 allowBuilds（better-sqlite3 不构建、esbuild 允许）
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint（biome check）
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/test-output.log

      # 2026-10-10：340d13a/142a112 单测步骤红而本地全维度复现均绿，日志需登录不可读——
      # 失败用例名经 ::error 工作流命令写进 check 注解（注解可经公开 API 匿名读取），
      # 免登录即可定位。每步注解上限 10 条：FAIL 行优先，附汇总行。
      - name: 失败用例摘录（写进 check 注解）
        if: failure()
        run: |
          {
            grep -E "tests? \| [0-9]+ failed|failed\) " /tmp/test-output.log | head -4
            grep -E "^ *× |^ *✗ " /tmp/test-output.log | head -6
            grep -iE "unhandled|segmen|worker .*exit|internal error" /tmp/test-output.log | head -3
            grep -E "Test Files|Tests  " /tmp/test-output.log | tail -2
          } | while IFS= read -r line; do
            msg=$(echo "$line" | tr -d '\r' | cut -c1-500)
            echo "::error::${msg}"
          done
          true

      # T1.7：规范文档由注册表生成（docs/dsl/规范.md、提示词模板.md、schema/content.json）。
      # 改了注册表/lint 规则/契约后忘记跑 pnpm gen:spec 时，此步失败（产物与代码不允许漂移）
      - name: 规范文档与代码同步（gen:spec 后 diff 须为空）
        run: |
          pnpm gen:spec
          git diff --exit-code

      - name: 构建
        run: pnpm build

  # T2.13 E2E（架构 §7.2：E2E 全过才可合并；webkit 项目必须在 CI 中运行）。
  # 独立 job：浏览器安装与单测互不拖慢；失败时上传 html 报告 artifact。
  # timeout 40 分钟：首跑浏览器缓存未命中时下载安装 + apt 系统库 + 测试本身，
  # 25 分钟实测不够（首跑被 GitHub 超时取消表现为 completed cancelled）。
  e2e:
    name: e2e (chromium + webkit, iPad 模拟)
    # 钉 24.04 而非跟随 ubuntu-latest 渐进迁移（2026-10-19 起）到 26.04：webkit 的 apt 系统
    # 库随发行版走。Playwright 1.61 起官方支持 Ubuntu 26.04（本仓库 @playwright/test 1.63），
    # 后续可单独起分支跑一轮 e2e 验证后再切 ubuntu-26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 浏览器版本随 pnpm-lock.yaml 里的 @playwright/test 版本走：lockfile 不变即命中缓存。
      # chromium 用 playwright 自带 build（config 中 CI 不走 msedge channel），
      # 与 webkit 一起落在 ~/.cache/ms-playwright，可整体缓存；系统库由 --with-deps 装。
      # restore-keys：版本升级后锁文件哈希变化时，降级命中旧目录（install 会补齐缺失部分）。
      # actions/cache@v6 起运行在 Node 24（v4 为 node20，已被 GitHub 弃用告警），用法不变。
      - name: 缓存 Playwright 浏览器
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: 浏览器缓存状态与耗时
        run: |
          echo "cache-hit=${{ steps.playwright-cache.outputs.cache-hit }}"
          du -sh ~/.cache/ms-playwright 2>/dev/null || echo "缓存目录尚不存在（首跑）"

      # 安装拆成两步并各自限时：卡在哪一步（chromium / webkit / apt 依赖）日志可直接定位。
      # chromium 用 --only-shell 只装 headless shell：E2E 全程 headless，完整 chromium
      # （带 headed 支持的 ~170MB build）用不上，headless shell 体积约为其一半。
      - name: 安装 chromium headless shell（含系统库）
        timeout-minutes: 10
        run: |
          start=$(date +%s)
          npx playwright install --with-deps --only-shell chromium
          echo "chromium 安装耗时 $(( $(date +%s) - start ))s"

      - name: 安装 webkit（含系统库）
        timeout-minutes: 10
        run: |
          start=$(date +%s)
          npx playwright install --with-deps webkit
          echo "webkit 安装耗时 $(( $(date +%s) - start ))s"
          du -sh ~/.cache/ms-playwright

      - name: E2E 测试
        run: pnpm e2e

      - name: 上传测试报告
        if: failure()
        # v7 运行在 Node 24；此前 @v4 为 node20（仅失败时才执行，故弃用告警一直未暴露）
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
