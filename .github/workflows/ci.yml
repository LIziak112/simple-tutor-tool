# CI：install → lint → typecheck → test → build（开发任务清单 T0.6）
name: CI

# 触发：push 到所有分支 + 所有 pull_request
on:
  push:
  pull_request:

# 同一分支/PR 有新推送时，取消仍在跑的旧运行，节省 CI 时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # 不传 version，pnpm/action-setup 自动读取根 package.json 的 packageManager 字段（pnpm@12.6.0）
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      # Node 版本与仓库约定一致（根 engines: >=24、.nvmrc: 24）；启用 pnpm store 缓存加速安装
      - name: 安装 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，保证可复现
      # pnpm 12 会自动遵守 pnpm-workspace.yaml 的 allowBuilds（better-sqlite3 不构建、esbuild 允许）
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint（biome check）
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      # T1.7：规范文档由注册表生成（docs/dsl/规范.md、提示词模板.md、schema/content.json）。
      # 改了注册表/lint 规则/契约后忘记跑 pnpm gen:spec 时，此步失败（产物与代码不允许漂移）
      - name: 规范文档与代码同步（gen:spec 后 diff 须为空）
        run: |
          pnpm gen:spec
          git diff --exit-code

      - name: 构建
        run: pnpm build

  # T2.13 E2E（架构 §7.2：E2E 全过才可合并；webkit 项目必须在 CI 中运行）。
  # 独立 job：浏览器安装与单测互不拖慢；失败时上传 html 报告 artifact。
  e2e:
    name: e2e (chromium + webkit, iPad 模拟)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 浏览器版本随 pnpm-lock.yaml 里的 @playwright/test 版本走：lockfile 不变即命中缓存。
      # chromium 用 playwright 自带 build（config 中 CI 不走 msedge channel），
      # 与 webkit 一起落在 ~/.cache/ms-playwright，可整体缓存；系统库由 --with-deps 装。
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 安装 Playwright 浏览器（chromium + webkit）
        run: npx playwright install --with-deps chromium webkit

      - name: E2E 测试
        run: pnpm e2e

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
