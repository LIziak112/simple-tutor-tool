# CI：install → lint → typecheck → test → build + 独立 e2e job（chromium/webkit）（开发任务清单 T0.6）
name: CI

# PR：先判定范围，说明文档仅跑轻量判定；代码按基点选测，基础设施改动兜底全量。
# main 推送、定时与手动运行：完整回归。定时仍只覆盖默认分支。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 17 * * *" # UTC 17:37 = 北京时间次日 01:37，避开整点
  workflow_dispatch:

# 同一分支/PR 有新推送时，取消仍在跑的旧运行，节省 CI 时长。group 带事件名：
# schedule（ref 为 refs/heads/main）与 push 到 main 分属不同组，夜跑不会被恰逢
# 其时的 main 推送取消，反之亦然
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
  CI_FULL: ${{ github.event_name != 'pull_request' }}

jobs:
  scope:
    name: 判定验证范围
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # 范围判定只运行 Node，不安装 pnpm，不能自动探测包管理器缓存。
          package-manager-cache: false
      - name: 验证范围决策回归
        run: node --test scripts/ci-scope.spec.mjs
      - name: 治理不变量闸门回归
        run: node --test scripts/governance-invariants.spec.mjs
      - name: 治理不变量闸门
        run: node scripts/governance-invariants.mjs
      - name: 文件规模闸门回归
        run: node --test scripts/file-size-guard.spec.mjs
      # AGENTS.md §五：全仓 1000 行硬线 + 历史基线只降不升（scripts/file-size-baseline.json）；
      # 400 行软线只对相对基点的改动文件提醒（写进 check 注解）。非 PR 事件基点是自身，不报软线。
      - name: 文件规模闸门
        run: node scripts/file-size-guard.mjs check --base "$CI_BASE"
      - id: scope
        name: 计算范围
        run: node scripts/ci-scope.mjs plan "$CI_BASE"

  checker:
    name: Windows x64 回信检查器
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      # 仅检查器打包需要内置 --build-sea；应用仍在 Node 24 验证。
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm checker:build --exe
      - run: pnpm checker:smoke --exe
      - uses: actions/upload-artifact@v7
        with:
          name: ownclass-ai-checker
          path: |
            dist/ai-reply-checker/manifest.json
            dist/ai-reply-checker/ownclass-ai-check.cjs
            dist/ai-reply-checker/ownclass-ai-check.exe
            dist/ai-reply-checker/exe-source.sha256
          retention-days: 14

  ci:
    needs: [scope, checker]
    if: needs.scope.outputs.run == 'true'
    name: lint / typecheck / test / build
    # ubuntu-latest 自 2026-10-19 起渐进迁移到 Ubuntu 26.04（至 11-19），窗口期内同一工作流
    # 会随机落在 24/26 两代系统上；显式钉 24.04 保证构建环境确定。切 26.04 时另行专门验证。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 不传 version，pnpm/action-setup 自动读取根 package.json 的 packageManager 字段（pnpm@12.6.0）。
      # v6 运行在 Node 24（v4 标签仍指向 node20 构建，已被 GitHub 弃用告警），v6.1.0 起明确支持 pnpm v12
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      # Node 版本与仓库约定一致（根 engines: >=24、.nvmrc: 24）；启用 pnpm store 缓存加速安装
      - name: 安装 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，保证可复现
      # pnpm 12 会自动遵守 pnpm-workspace.yaml 的 allowBuilds（better-sqlite3 不构建、esbuild 允许）
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint（biome check）
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: |
          set -o pipefail
          node scripts/ci-scope.mjs unit "$CI_BASE" 2>&1 | tee /tmp/test-output.log

      # 2026-10-10：340d13a/142a112 单测步骤红而本地全维度复现均绿，日志需登录不可读——
      # 失败用例名经 ::error 工作流命令写进 check 注解（注解可经公开 API 匿名读取），
      # 免登录即可定位。每步注解上限 10 条：FAIL 行优先，附汇总行。
      - name: 失败用例摘录（写进 check 注解）
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' /tmp/test-output.log > /tmp/test-clean.log
          {
            grep -B1 -A14 "Unhandled Errors" /tmp/test-clean.log | head -14
            grep -E "Test Files|Tests  " /tmp/test-clean.log | tail -2
          } | while IFS= read -r line; do
            msg=$(echo "$line" | tr -d '\r' | cut -c1-500)
            echo "::error::${msg}"
          done
          true

      # T1.7：规范文档由注册表生成（docs/dsl/规范.md、提示词模板.md、schema/content.json）。
      # 改了注册表/lint 规则/契约后忘记跑 pnpm gen:spec 时，此步失败（产物与代码不允许漂移）
      - name: 规范文档与代码同步（gen:spec 后 diff 须为空）
        run: |
          pnpm gen:spec
          git diff --exit-code

      - name: 获取同一提交的 Windows 检查器产物
        uses: actions/download-artifact@v8
        with:
          name: ownclass-ai-checker
          path: dist/ai-reply-checker

      - name: 构建
        run: pnpm build

      - name: 确认服务端交付包含 Windows exe
        run: node -e "const m = JSON.parse(require('node:fs').readFileSync('apps/server/dist/ai-reply-checker/manifest.json', 'utf8')); if (!m.files.some(f => f.platform === 'win32-x64')) process.exit(1)"

  # T2.13 E2E（架构 §7.2：E2E 全过才可合并；webkit 项目必须在 CI 中运行）。
  # 独立 job：浏览器安装与单测互不拖慢；失败时上传 html 报告 artifact。
  # timeout 55 分钟包含镜像拉取、安装项目依赖及测试本体（globalTimeout 45m 含重试余量）。
  e2e:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: e2e (chromium + webkit, iPad 模拟)
    runs-on: ubuntu-24.04
    container:
      # 官方 Noble 镜像已包含浏览器与系统库，避开 runner 的 Ubuntu 软件源故障。
      # 升级锁文件中的 @playwright/test 时同步更新镜像版本。
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 55
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: E2E 测试
        run: node scripts/ci-scope.mjs e2e "$CI_BASE"

      - name: 上传测试报告
        if: failure()
        # v7 运行在 Node 24；此前 @v4 为 node20（仅失败时才执行，故弃用告警一直未暴露）
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  result:
    name: CI 结果
    if: always()
    needs: [scope, ci, e2e, checker]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 汇总（可作为固定必需检查）
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          APP_RESULT: ${{ needs.ci.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CHECKER_RESULT: ${{ needs.checker.result }}
          RUN_APP: ${{ needs.scope.outputs.run }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$RUN_APP" = true ]; then
            test "$CHECKER_RESULT" = success
            test "$APP_RESULT" = success
            test "$E2E_RESULT" = success
            exit 0
          fi
          for result in "$APP_RESULT" "$E2E_RESULT" "$CHECKER_RESULT"; do
            test "$result" = success || test "$result" = skipped || exit 1
          done
