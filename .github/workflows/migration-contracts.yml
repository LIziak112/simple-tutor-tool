name: Migration contracts
on:
  pull_request:
    paths:
      - 'docs/内核迁移/**'
      - 'packages/grading/**'
      - 'apps/server/src/**'
      - '.github/workflows/migration-contracts.yml'
permissions:
  contents: read
jobs:
  migration-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >
          pnpm exec vitest run
          packages/grading/src/grade-row.test.ts
          apps/server/src/routes/student-practice-question-submit.test.ts
          apps/server/src/services/attempt-settlements.test.ts
